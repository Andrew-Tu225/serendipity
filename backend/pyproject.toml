[project]
name = "serendipity-api"
version = "0.1.0"
description = "FastAPI backend for Serendipity"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "authlib>=1.9,<2",
    "fastapi[standard]>=0.115",
    "httpx>=0.28,<1",
    "httpx2>=2,<3",
    "joserfc>=1,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
